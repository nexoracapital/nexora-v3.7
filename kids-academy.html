<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Academy - Nexora Education Hub</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Fredoka (Kids Fun) & Noto Nastaliq Urdu -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Noto+Nastaliq+Urdu:wght@700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
    }
    .font-urdu {
      font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
    }
    .font-kids {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    button, a {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* چمکتی اور اچھلتی اینیمیشنز */
    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .bounce-banner {
      animation: gentle-bounce 3s infinite ease-in-out;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-glow {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-sky-50 to-pink-100 min-h-screen text-slate-800 flex flex-col items-center p-3 sm:p-6">

  <!-- ================= TOP HEADER ================= -->
  <header class="w-full max-w-5xl flex items-center justify-between mb-4 sm:mb-6 px-2">
    <div class="flex items-center gap-2">
      <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-ping"></span>
      <span class="text-xs sm:text-sm font-extrabold text-indigo-900 tracking-wide">Nexora Education Hub</span>
    </div>
    
    <!-- واپس جانے کا بٹن -->
    <button id="topBackBtn" onclick="goHome()" class="hidden px-5 py-2 bg-white text-indigo-700 font-extrabold rounded-2xl shadow-md border-2 border-indigo-100 hover:bg-indigo-50 active:scale-95 transition text-sm flex items-center gap-2">
      <span>⬅</span> واپس ہوم پر جائیں
    </button>
  </header>

  <!-- ================= 1. مرکزی ویو: KIDS ACADEMY BUTTON ================= -->
  <section id="view-hub" class="w-full max-w-3xl text-center my-auto flex flex-col items-center py-8">
    <div class="mb-4">
      <span class="text-5xl sm:text-6xl bounce-banner inline-block">🎈</span>
      <h2 class="text-lg sm:text-xl font-black text-indigo-600 font-kids tracking-wider mt-2">✨ WELCOME TO KIDS PORTAL ✨</h2>
    </div>

    <!-- MAIN KIDS ACADEMY BUTTON (High-End Graphic Card) -->
    <div class="w-full max-w-md px-4">
      <button onclick="showBooksSelection()" class="pulse-glow w-full relative group block rounded-[32px] p-1.5 bg-gradient-to-r from-pink-500 via-amber-400 to-indigo-600 shadow-2xl hover:shadow-indigo-300 transition-all duration-300 active:scale-95">
        <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 rounded-[28px] px-6 py-8 flex flex-col items-center justify-center text-white border-2 border-white/40">
          <div class="flex items-center gap-3">
            <span class="text-4xl sm:text-5xl">🎓</span>
            <span class="text-3xl sm:text-4xl font-black font-kids tracking-wider drop-shadow-md">KIDS ACADEMY</span>
          </div>
          <div class="mt-3 px-4 py-1.5 bg-white/20 backdrop-blur-sm rounded-full text-xs sm:text-sm font-bold text-yellow-200 font-urdu border border-white/20">
            کتابیں کھولنے کے لیے یہاں کلک کریں 👇
          </div>
        </div>
      </button>
    </div>

    <p class="text-xs text-slate-500 font-bold mt-6 tracking-wide">آف لائن اور آن لائن دونوں میں بغیر انٹرنیٹ بھی کام کرے گا ⚡</p>
  </section>

  <!-- ================= 2. تین کتابوں کا انتخاب (3 GRAPHICAL BOOKS) ================= -->
  <section id="view-books" class="hidden w-full max-w-5xl text-center py-4">
    <div class="mb-8">
      <span class="px-5 py-2 rounded-full bg-gradient-to-r from-indigo-500 to-pink-500 text-white font-black text-xs sm:text-sm uppercase tracking-widest shadow-md">
        🌟 Kids Academy Books
      </span>
      <h1 class="text-3xl sm:text-4xl font-black text-slate-800 font-urdu mt-3">
        اپنی پسندیدہ کتاب کا انتخاب کریں
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 font-bold mt-1">کسی بھی کتاب پر کلک کریں اور آواز سن کر پڑھیں</p>
    </div>

    <!-- THREE BOOK BUTTONS (With Your Actual Uploaded Pictures) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 sm:gap-8 px-3">

      <!-- BOOK 1: My ABC Book -->
      <button onclick="openBook('abc')" class="group relative rounded-3xl overflow-hidden bg-white shadow-xl hover:shadow-2xl border-4 border-sky-400 hover:-translate-y-2 active:scale-95 transition-all duration-300 flex flex-col">
        <div class="w-full bg-sky-200 overflow-hidden flex items-center justify-center p-1">
          <!-- Image 59147.png -->
          <img src="59147.png" alt="My ABC Book" class="w-full h-auto object-contain rounded-2xl group-hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.src='https://placehold.co/600x230/38bdf8/ffffff?text=My+ABC+Book';">
        </div>
        <div class="p-4 bg-sky-50 w-full flex items-center justify-between border-t-2 border-sky-100">
          <div class="text-right">
            <span class="text-xl font-black text-sky-800 font-kids block leading-tight">My ABC Book</span>
            <span class="text-xs text-sky-600 font-urdu">مکمل اے بی سی بمع تلفظ</span>
          </div>
          <span class="px-4 py-2 bg-sky-500 group-hover:bg-sky-600 text-white rounded-2xl font-black text-xs shadow-md transition">کتاب کھولیں 📖</span>
        </div>
      </button>

      <!-- BOOK 2: My 123 Book -->
      <button onclick="openBook('numbers')" class="group relative rounded-3xl overflow-hidden bg-white shadow-xl hover:shadow-2xl border-4 border-amber-400 hover:-translate-y-2 active:scale-95 transition-all duration-300 flex flex-col">
        <div class="w-full bg-amber-200 overflow-hidden flex items-center justify-center p-1">
          <!-- Image 59154.png -->
          <img src="59154.png" alt="My 123 Book" class="w-full h-auto object-contain rounded-2xl group-hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.src='https://placehold.co/600x230/fbbf24/ffffff?text=My+123+Book';">
        </div>
        <div class="p-4 bg-amber-50 w-full flex items-center justify-between border-t-2 border-amber-100">
          <div class="text-right">
            <span class="text-xl font-black text-amber-800 font-kids block leading-tight">My 123 Book</span>
            <span class="text-xs text-amber-600 font-urdu">1 سے 100 تک مکمل گنتی</span>
          </div>
          <span class="px-4 py-2 bg-amber-500 group-hover:bg-amber-600 text-white rounded-2xl font-black text-xs shadow-md transition">کتاب کھولیں 🔢</span>
        </div>
      </button>

      <!-- BOOK 3: My الف ب پ Book -->
      <button onclick="openBook('urdu')" class="group relative rounded-3xl overflow-hidden bg-white shadow-xl hover:shadow-2xl border-4 border-emerald-400 hover:-translate-y-2 active:scale-95 transition-all duration-300 flex flex-col">
        <div class="w-full bg-emerald-200 overflow-hidden flex items-center justify-center p-1">
          <!-- Image 59155.png -->
          <img src="59155.png" alt="My Urdu Book" class="w-full h-auto object-contain rounded-2xl group-hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.src='https://placehold.co/600x230/34d399/ffffff?text=My+Urdu+Book';">
        </div>
        <div class="p-4 bg-emerald-50 w-full flex items-center justify-between border-t-2 border-emerald-100">
          <div class="text-right">
            <span class="text-xl font-bold text-emerald-800 font-urdu block leading-tight">My الف ب پ Book</span>
            <span class="text-xs text-emerald-600 font-urdu">آ سے ے تک مکمل حروف</span>
          </div>
          <span class="px-4 py-2 bg-emerald-500 group-hover:bg-emerald-600 text-white rounded-2xl font-black text-xs shadow-md transition font-urdu">کتاب کھولیں 🇵🇰</span>
        </div>
      </button>

    </div>
  </section>
    <section id="view-active-book" class="hidden w-full max-w-5xl py-2">
    <!-- ٹاپ پینل برائے کتاب کی تفصیلات -->
    <div class="flex flex-wrap items-center justify-between bg-white rounded-3xl px-5 py-4 shadow-lg mb-6 border-2 border-slate-100 gap-3">
      <div class="flex items-center gap-3">
        <span id="activeBookIcon" class="text-4xl">🔤</span>
        <div class="text-right">
          <h2 id="activeBookTitle" class="text-2xl sm:text-3xl font-black text-slate-800 font-kids leading-none"></h2>
          <p id="activeBookSubtitle" class="text-xs sm:text-sm text-slate-500 font-urdu mt-1"></p>
        </div>
      </div>
      <button onclick="showBooksSelection()" class="px-5 py-2.5 rounded-2xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-black text-xs sm:text-sm transition flex items-center gap-2 border border-indigo-200 font-urdu">
        <span>🔄</span> دوسری کتاب منتخب کریں
      </button>
    </div>

    <!-- حروف اور نمبرز کے بٹنوں کا ریسپانسو گرڈ -->
    <div id="soundButtonsContainer" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3 sm:gap-4 justify-items-center">
      <!-- Buttons will be generated dynamically -->
    </div>
  </section>

  <!-- ================= JAVASCRIPT & SPEECH LOGIC ================= -->
  <script>
    // 1. ڈیٹا سورس
    const abcData = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => ({
      display: l,
      phonics: l,
      lang: "en-US"
    }));

    const urduData = [
      "آ", "ا", "ب", "پ", "ت", "ٹ", "ث", "ج", "چ", "ح", "خ", 
      "د", "ڈ", "ذ", "ر", "ڑ", "ز", "ژ", "س", "ش", "ص", "ض", 
      "ط", "ظ", "ع", "غ", "ف", "ق", "ک", "گ", "ل", "م", "ن", 
      "ں", "و", "ہ", "ھ", "ء", "ی", "ے"
    ].map(l => ({
      display: l,
      phonics: l,
      lang: "ur-PK"
    }));

    const numbersData = Array.from({ length: 100 }, (_, i) => ({
      display: (i + 1).toString(),
      phonics: (i + 1).toString(),
      lang: "en-US"
    }));

    // بٹنوں کے پرکشش رنگ
    const cardColors = [
      "bg-rose-50 border-rose-300 text-rose-600 hover:bg-rose-100",
      "bg-sky-50 border-sky-300 text-sky-600 hover:bg-sky-100",
      "bg-amber-50 border-amber-300 text-amber-600 hover:bg-amber-100",
      "bg-emerald-50 border-emerald-300 text-emerald-600 hover:bg-emerald-100",
      "bg-violet-50 border-violet-300 text-violet-600 hover:bg-violet-100",
      "bg-teal-50 border-teal-300 text-teal-600 hover:bg-teal-100",
      "bg-fuchsia-50 border-fuchsia-300 text-fuchsia-600 hover:bg-fuchsia-100"
    ];

    // 2. آف لائن آواز نکالنے کا فنکشن (Speech Synthesis)
    function playVoice(text, lang) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // پچھلی آواز فوراً بند کرو
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.82; // بچوں کے لیے پرسکون اور واضح رفتار
        utterance.pitch = 1.15; // پرکشش آواز
        window.speechSynthesis.speak(utterance);
      }
    }

    // 3. نیویگیشن لاجک
    const hubView = document.getElementById("view-hub");
    const booksView = document.getElementById("view-books");
    const activeBookView = document.getElementById("view-active-book");
    const topBackBtn = document.getElementById("topBackBtn");

    function showBooksSelection() {
      hubView.classList.add("hidden");
      activeBookView.classList.add("hidden");
      booksView.classList.remove("hidden");
      topBackBtn.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goHome() {
      booksView.classList.add("hidden");
      activeBookView.classList.add("hidden");
      hubView.classList.remove("hidden");
      topBackBtn.classList.add("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 4. کتاب کھولنا اور آواز والے بٹن جنریٹ کرنا
    function openBook(type) {
      booksView.classList.add("hidden");
      activeBookView.classList.remove("hidden");
      topBackBtn.classList.remove("hidden");

      const container = document.getElementById("soundButtonsContainer");
      container.innerHTML = "";

      const iconEl = document.getElementById("activeBookIcon");
      const titleEl = document.getElementById("activeBookTitle");
      const subTitleEl = document.getElementById("activeBookSubtitle");

      let items = [];
      let isUrdu = false;

      if (type === 'abc') {
        iconEl.innerText = "🔤";
        titleEl.innerText = "My ABC Book";
        subTitleEl.innerText = "کسی بھی حرف پر کلک کریں اور اس کا تلفظ سنیں";
        items = abcData;
      } else if (type === 'numbers') {
        iconEl.innerText = "🔢";
        titleEl.innerText = "My 123 Book";
        subTitleEl.innerText = "گنتی کے کارڈ پر ٹیپ کریں اور آواز سنیں";
        items = numbersData;
      } else if (type === 'urdu') {
        iconEl.innerText = "🇵🇰";
        titleEl.innerText = "My الف ب پ Book";
        subTitleEl.innerText = "حرفِ تہجی پر کلک کریں اور درست اردو تلفظ سنیں";
        items = urduData;
        isUrdu = true;
      }

      // بٹن تیار کرنا
      items.forEach((item, index) => {
        const colorClass = cardColors[index % cardColors.length];
        const btn = document.createElement("button");
        
        btn.className = `w-full h-20 sm:h-24 rounded-2xl flex flex-col items-center justify-center border-b-4 shadow-md transition-all duration-150 transform hover:-translate-y-1 active:translate-y-1 active:scale-95 ${colorClass}`;
        
        if (isUrdu) {
          btn.innerHTML = `<span class="text-3xl sm:text-4xl font-urdu leading-none pt-2">${item.display}</span>`;
        } else {
          btn.innerHTML = `<span class="text-2xl sm:text-3xl font-black font-kids">${item.display}</span>`;
        }

        btn.onclick = () => {
          if (navigator.vibrate) navigator.vibrate(40); // موبائل پر کلک وائبریشن
          playVoice(item.phonics, item.lang);
        };

        container.appendChild(btn);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 5. آف لائن سپورٹ کے لیے سروس ورکر (Service Worker)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => clients.claim());
        self.addEventListener('fetch', (e) => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
