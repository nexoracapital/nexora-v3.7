<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Professional DMC & Result Sheet Studio</title>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
    
    * { box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #0f172a; }

    /* Editable Inline Text */
    [contenteditable="true"]:focus {
      outline: 2px solid #2563eb;
      background-color: #eff6ff;
      border-radius: 4px;
    }

    /* A4 Portrait for DMC */
    .a4-portrait {
      width: 210mm;
      min-height: 297mm;
      padding: 10mm 12mm;
      margin: 0 auto;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    /* A4 Landscape for Class Broadsheet */
    .a4-landscape {
      width: 297mm;
      min-height: 210mm;
      padding: 8mm 10mm;
      margin: 0 auto;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .meta-field-line {
      display: inline-block;
      border-bottom: 1.5px solid #475569;
      min-width: 120px;
      font-weight: 700;
      color: #0f172a;
      padding-left: 4px;
    }

    @media print {
      body { background: white !important; margin: 0 !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .print-area {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        padding: 5mm 8mm !important;
      }
      @page {
        margin: 5mm;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Top Controller Bar (Hidden on Print) -->
  <header class="bg-slate-900 border-b border-slate-800 text-white sticky top-0 z-50 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-500 flex items-center justify-center font-black text-xl text-white shadow">
          NX
        </div>
        <div>
          <h1 class="text-base font-bold tracking-wide uppercase leading-tight">Nexora DMC & Result Generator</h1>
          <p class="text-xs text-slate-400">1st Term, Combined Terms DMC & Class Broad Sheet</p>
        </div>
      </div>

      <!-- Mode Switcher Buttons -->
      <div class="flex bg-slate-800 p-1 rounded-2xl border border-slate-700">
        <button id="btnTerm1" onclick="switchMode('single')" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-blue-600 text-white shadow">
          <i class="fa-solid fa-file-invoice"></i> 1st Term DMC
        </button>
        <button id="btnCombined" onclick="switchMode('combined')" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
          <i class="fa-solid fa-copy"></i> 1st & 2nd Term Combined DMC
        </button>
        <button id="btnSheet" onclick="switchMode('sheet')" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
          <i class="fa-solid fa-table-list"></i> Full Class Result Sheet
        </button>
      </div>

      <div>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow">
          <i class="fa-solid fa-print"></i> Print / Save PDF
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-3 md:p-6 space-y-6">

    <!-- Configuration Panel (Hidden on Print) -->
    <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm no-print space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">School / College Name</label>
          <input type="text" id="cfgSchoolName" value="GOVERNMENT MODEL HIGH SCHOOL & DEGREE COLLEGE" oninput="updateHeaderPreview()" class="w-full p-2.5 rounded-xl border border-slate-300 text-xs font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Exam / Session Title</label>
          <input type="text" id="cfgExamSession" value="Annual Examination Session 2026 - 2027" oninput="updateHeaderPreview()" class="w-full p-2.5 rounded-xl border border-slate-300 text-xs">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Upload School Monogram / Logo</label>
          <input type="file" id="cfgLogo" accept="image/*" onchange="handleLogoUpload(event)" class="w-full p-1.5 rounded-xl border border-slate-300 text-xs bg-slate-50 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white">
        </div>
        <div class="flex items-end">
          <button onclick="addSubjectRow()" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-xl text-xs font-bold shadow">
            + Add New Subject
          </button>
        </div>
      </div>
    </div>

    <!-- PRINTABLE SHEET CONTAINER -->
    <div class="flex justify-center overflow-x-auto">
      <div id="renderArea" class="a4-portrait print-area">
        <!-- DMC Content is dynamically injected here -->
      </div>
    </div>

  </main>

  <script>
    let currentMode = "single"; // "single", "combined", "sheet"
    let uploadedLogo = "";

    // Subjects and Marks Store
    let subjectsData = [
      { name: "English", total1: 100, obt1: 85, total2: 100, obt2: 88 },
      { name: "Urdu", total1: 100, obt1: 78, total2: 100, obt2: 82 },
      { name: "Mathematics", total1: 100, obt1: 94, total2: 100, obt2: 96 },
      { name: "General Science / Physics", total1: 75, obt1: 62, total2: 75, obt2: 68 },
      { name: "Islamiat / Ethics", total1: 50, obt1: 45, total2: 50, obt2: 47 },
      { name: "Pakistan Studies", total1: 50, obt1: 41, total2: 50, obt2: 44 },
      { name: "Computer Science", total1: 75, obt1: 69, total2: 75, obt2: 71 }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentView();
    });

    function updateHeaderPreview() {
      const elSchool = document.getElementById('viewSchoolTitle');
      const elSession = document.getElementById('viewExamSession');
      if (elSchool) elSchool.innerText = document.getElementById('cfgSchoolName').value;
      if (elSession) elSession.innerText = document.getElementById('cfgExamSession').value;
    }

    function switchMode(mode) {
      currentMode = mode;
      
      const b1 = document.getElementById('btnTerm1');
      const b2 = document.getElementById('btnCombined');
      const b3 = document.getElementById('btnSheet');

      b1.className = "px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";
      b2.className = "px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";
      b3.className = "px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white";

      if (mode === 'single') b1.className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-blue-600 text-white shadow";
      else if (mode === 'combined') b2.className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-blue-600 text-white shadow";
      else b3.className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-blue-600 text-white shadow";

      renderCurrentView();
    }
    function calculateGrade(percentage) {
      if (percentage >= 80) return { grade: "A-1 / A+", remarks: "Outstanding" };
      if (percentage >= 70) return { grade: "A", remarks: "Excellent" };
      if (percentage >= 60) return { grade: "B", remarks: "Very Good" };
      if (percentage >= 50) return { grade: "C", remarks: "Good" };
      if (percentage >= 40) return { grade: "D", remarks: "Fair" };
      if (percentage >= 33) return { grade: "E", remarks: "Satisfactory" };
      return { grade: "F", remarks: "Needs Improvement" };
    }

    function addSubjectRow() {
      subjectsData.push({ name: "New Subject", total1: 100, obt1: 0, total2: 100, obt2: 0 });
      renderCurrentView();
    }

    function deleteSubjectRow(idx) {
      if (confirm("Remove this subject from DMC?")) {
        subjectsData.splice(idx, 1);
        renderCurrentView();
      }
    }

    function updateSubject(idx, key, value) {
      subjectsData[idx][key] = (key === 'name') ? value : (parseFloat(value) || 0);
      renderCurrentView();
    }

    function renderCurrentView() {
      const container = document.getElementById('renderArea');
      const schoolName = document.getElementById('cfgSchoolName').value;
      const sessionTitle = document.getElementById('cfgExamSession').value;

      if (currentMode === 'single') {
        container.className = "a4-portrait print-area";
        container.innerHTML = getSingleTermDMCHTML(schoolName, sessionTitle);
      } else if (currentMode === 'combined') {
        container.className = "a4-portrait print-area";
        container.innerHTML = getCombinedTermDMCHTML(schoolName, sessionTitle);
      } else {
        container.className = "a4-landscape print-area";
        container.innerHTML = getClassBroadSheetHTML(schoolName, sessionTitle);
      }
    }

    // 1. Single Term DMC Template (First Term)
    function getSingleTermDMCHTML(school, session) {
      let grandTotal = 0;
      let grandObt = 0;

      const rows = subjectsData.map((s, idx) => {
        grandTotal += s.total1;
        grandObt += s.obt1;
        const pct = s.total1 > 0 ? ((s.obt1 / s.total1) * 100).toFixed(1) : 0;
        const res = calculateGrade(pct);

        return `
          <tr class="border-b border-slate-300 text-xs">
            <td class="p-2 border-r border-slate-300 text-center">${idx + 1}</td>
            <td class="p-2 border-r border-slate-300 font-bold" contenteditable="true" onblur="updateSubject(${idx}, 'name', this.innerText)">${s.name}</td>
            <td class="p-2 border-r border-slate-300 text-center" contenteditable="true" onblur="updateSubject(${idx}, 'total1', this.innerText)">${s.total1}</td>
            <td class="p-2 border-r border-slate-300 text-center font-bold text-blue-900" contenteditable="true" onblur="updateSubject(${idx}, 'obt1', this.innerText)">${s.obt1}</td>
            <td class="p-2 border-r border-slate-300 text-center">${pct}%</td>
            <td class="p-2 border-r border-slate-300 text-center font-bold">${res.grade}</td>
            <td class="p-2 text-center text-slate-600">${res.remarks}</td>
            <td class="p-2 text-center no-print">
              <button onclick="deleteSubjectRow(${idx})" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');

      const totalPct = grandTotal > 0 ? ((grandObt / grandTotal) * 100).toFixed(2) : 0;
      const finalEval = calculateGrade(totalPct);

      return `
        <!-- Institutional Header -->
        <div class="border-2 border-slate-900 rounded-2xl p-4 mb-4">
          <div class="flex items-center justify-between pb-3 border-b-2 border-slate-900 gap-4">
            ${uploadedLogo ? `<img src="${uploadedLogo}" class="h-16 w-16 object-contain">` : `<div class="w-14 h-14 border border-slate-400 rounded-xl flex items-center justify-center text-[10px] text-slate-400 font-bold">SEAL</div>`}
            <div class="flex-1 text-center">
              <h2 id="viewSchoolTitle" class="text-xl md:text-2xl font-black uppercase tracking-wider text-slate-900">${school}</h2>
              <p class="text-xs font-bold text-blue-900 uppercase tracking-widest mt-0.5">Official Detailed Marks Certificate (D.M.C)</p>
              <p id="viewExamSession" class="text-xs font-semibold text-slate-600 mt-0.5">First Term Examination • ${session}</p>
            </div>
            <div class="w-14 text-right">
              <span class="text-[10px] font-bold bg-blue-900 text-white px-2.5 py-1 rounded">1st Term</span>
            </div>
          </div>

          <!-- Student Information Grid -->
          <div class="grid grid-cols-3 gap-y-2 pt-3 text-xs text-slate-800">
            <div>Student Name: <span contenteditable="true" class="meta-field-line">Muhammad Ahmed</span></div>
            <div>Father Name: <span contenteditable="true" class="meta-field-line">Tariq Majeed</span></div>
            <div>Roll Number: <span contenteditable="true" class="meta-field-line">1024</span></div>
            <div>Class & Section: <span contenteditable="true" class="meta-field-line">10th (Science-A)</span></div>
            <div>Date of Birth: <span contenteditable="true" class="meta-field-line">14-08-2010</span></div>
            <div>Issue Date: <span contenteditable="true" class="meta-field-line">21-10-2026</span></div>
          </div>
        </div>

        <!-- Marks Table -->
        <table class="w-full border-collapse border-2 border-slate-900 mb-4">
          <thead>
            <tr class="bg-slate-900 text-white text-xs uppercase tracking-wider">
              <th class="p-2 border border-slate-700 w-10">#</th>
              <th class="p-2 border border-slate-700 text-left">Subject Name</th>
              <th class="p-2 border border-slate-700 w-24">Total Marks</th>
              <th class="p-2 border border-slate-700 w-28">Obtained Marks</th>
              <th class="p-2 border border-slate-700 w-20">Percentage</th>
              <th class="p-2 border border-slate-700 w-20">Grade</th>
              <th class="p-2 border border-slate-700 w-28">Remarks</th>
              <th class="p-2 border border-slate-700 w-10 no-print">Action</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="bg-slate-100 font-black text-xs border-t-2 border-slate-900">
              <td colspan="2" class="p-2 text-right uppercase border-r border-slate-400">Grand Total:</td>
              <td class="p-2 text-center border-r border-slate-400">${grandTotal}</td>
              <td class="p-2 text-center text-blue-900 border-r border-slate-400">${grandObt}</td>
              <td class="p-2 text-center border-r border-slate-400">${totalPct}%</td>
              <td class="p-2 text-center border-r border-slate-400">${finalEval.grade}</td>
              <td class="p-2 text-center text-emerald-800">${finalEval.remarks}</td>
              <td class="no-print"></td>
            </tr>
          </tbody>
        </table>

        <!-- Result Summary & Statistics -->
        <div class="grid grid-cols-4 gap-2 bg-slate-50 border border-slate-300 rounded-xl p-3 text-center text-xs mb-6">
          <div>Percentage: <b class="text-blue-900">${totalPct}%</b></div>
          <div>Final Grade: <b class="text-emerald-700">${finalEval.grade}</b></div>
          <div>Position in Class: <b contenteditable="true" class="text-indigo-900 underline">1st Position</b></div>
          <div>Overall Status: <b class="text-emerald-800 font-black">PASSED</b></div>
        </div>

        <!-- Verification Signatures -->
        <div class="pt-8 border-t border-slate-300 grid grid-cols-3 gap-4 text-center text-xs font-bold text-slate-700">
          <div>
            <div class="w-36 h-0.5 bg-slate-400 mx-auto mb-1.5"></div>
            <span>Class Incharge</span>
          </div>
          <div>
            <div class="w-36 h-0.5 bg-slate-400 mx-auto mb-1.5"></div>
            <span>Controller of Examinations</span>
          </div>
          <div>
            <div class="w-36 h-0.5 bg-slate-400 mx-auto mb-1.5"></div>
            <span>Principal / Headmaster</span>
          </div>
        </div>

        <div class="text-center pt-4 text-[9px] text-slate-400 font-semibold tracking-wider">
          Official Computerized DMC • Powered by Nexora School OS (www.nexoraustaad.com)
        </div>
      `;
                                    }
        // 2. Combined 1st & 2nd Term / Final DMC
    function getCombinedTermDMCHTML(school, session) {
      let grandT1 = 0, grandO1 = 0;
      let grandT2 = 0, grandO2 = 0;

      const rows = subjectsData.map((s, idx) => {
        grandT1 += s.total1; grandO1 += s.obt1;
        grandT2 += s.total2; grandO2 += s.obt2;

        const subCombinedTotal = s.total1 + s.total2;
        const subCombinedObt = s.obt1 + s.obt2;
        const pct = subCombinedTotal > 0 ? ((subCombinedObt / subCombinedTotal) * 100).toFixed(1) : 0;
        const res = calculateGrade(pct);

        return `
          <tr class="border-b border-slate-300 text-xs">
            <td class="p-1.5 border-r border-slate-300 text-center">${idx + 1}</td>
            <td class="p-1.5 border-r border-slate-300 font-bold" contenteditable="true" onblur="updateSubject(${idx}, 'name', this.innerText)">${s.name}</td>
            
            <!-- 1st Term -->
            <td class="p-1.5 border-r border-slate-300 text-center" contenteditable="true" onblur="updateSubject(${idx}, 'total1', this.innerText)">${s.total1}</td>
            <td class="p-1.5 border-r border-slate-300 text-center font-semibold" contenteditable="true" onblur="updateSubject(${idx}, 'obt1', this.innerText)">${s.obt1}</td>
            
            <!-- 2nd Term -->
            <td class="p-1.5 border-r border-slate-300 text-center" contenteditable="true" onblur="updateSubject(${idx}, 'total2', this.innerText)">${s.total2}</td>
            <td class="p-1.5 border-r border-slate-300 text-center font-semibold" contenteditable="true" onblur="updateSubject(${idx}, 'obt2', this.innerText)">${s.obt2}</td>
            
            <!-- Combined Aggregate -->
            <td class="p-1.5 border-r border-slate-300 text-center font-bold text-slate-800">${subCombinedTotal}</td>
            <td class="p-1.5 border-r border-slate-300 text-center font-black text-blue-900">${subCombinedObt}</td>
            <td class="p-1.5 border-r border-slate-300 text-center">${pct}%</td>
            <td class="p-1.5 border-r border-slate-300 text-center font-bold">${res.grade}</td>
            <td class="p-1.5 text-center text-slate-600">${res.remarks}</td>
            <td class="p-1.5 text-center no-print">
              <button onclick="deleteSubjectRow(${idx})" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');

      const overallTotal = grandT1 + grandT2;
      const overallObtained = grandO1 + grandO2;
      const grandPct = overallTotal > 0 ? ((overallObtained / overallTotal) * 100).toFixed(2) : 0;
      const finalEval = calculateGrade(grandPct);

      return `
        <!-- Institutional Header -->
        <div class="border-2 border-slate-900 rounded-2xl p-4 mb-3">
          <div class="flex items-center justify-between pb-2.5 border-b-2 border-slate-900 gap-4">
            ${uploadedLogo ? `<img src="${uploadedLogo}" class="h-16 w-16 object-contain">` : `<div class="w-14 h-14 border border-slate-400 rounded-xl flex items-center justify-center text-[10px] text-slate-400 font-bold">SEAL</div>`}
            <div class="flex-1 text-center">
              <h2 id="viewSchoolTitle" class="text-xl md:text-2xl font-black uppercase tracking-wider text-slate-900">${school}</h2>
              <p class="text-xs font-bold text-blue-900 uppercase tracking-widest mt-0.5">Combined Cumulative D.M.C (1st & 2nd Term)</p>
              <p id="viewExamSession" class="text-xs font-semibold text-slate-600 mt-0.5">${session}</p>
            </div>
            <div class="w-14 text-right">
              <span class="text-[10px] font-bold bg-emerald-800 text-white px-2 py-1 rounded">Combined</span>
            </div>
          </div>

          <!-- Student Information Grid -->
          <div class="grid grid-cols-3 gap-y-2 pt-2.5 text-xs text-slate-800">
            <div>Student Name: <span contenteditable="true" class="meta-field-line">Muhammad Ahmed</span></div>
            <div>Father Name: <span contenteditable="true" class="meta-field-line">Tariq Majeed</span></div>
            <div>Roll Number: <span contenteditable="true" class="meta-field-line">1024</span></div>
            <div>Class & Section: <span contenteditable="true" class="meta-field-line">10th (Science-A)</span></div>
            <div>Date of Birth: <span contenteditable="true" class="meta-field-line">14-08-2010</span></div>
            <div>Issue Date: <span contenteditable="true" class="meta-field-line">21-10-2026</span></div>
          </div>
        </div>

        <!-- Combined Marks Table -->
        <table class="w-full border-collapse border-2 border-slate-900 mb-3">
          <thead>
            <tr class="bg-slate-900 text-white text-[11px] uppercase tracking-wider">
              <th rowspan="2" class="p-1 border border-slate-700 w-8">#</th>
              <th rowspan="2" class="p-1 border border-slate-700 text-left">Subject</th>
              <th colspan="2" class="p-1 border border-slate-700 bg-slate-800">1st Term</th>
              <th colspan="2" class="p-1 border border-slate-700 bg-slate-800">2nd Term</th>
              <th colspan="5" class="p-1 border border-slate-700 bg-blue-950">Combined Aggregate</th>
              <th rowspan="2" class="p-1 border border-slate-700 w-8 no-print">Del</th>
            </tr>
            <tr class="bg-slate-800 text-white text-[10px]">
              <th class="p-1 border border-slate-700">Total</th>
              <th class="p-1 border border-slate-700">Obt</th>
              <th class="p-1 border border-slate-700">Total</th>
              <th class="p-1 border border-slate-700">Obt</th>
              <th class="p-1 border border-slate-700">Grand Total</th>
              <th class="p-1 border border-slate-700">Grand Obt</th>
              <th class="p-1 border border-slate-700">%</th>
              <th class="p-1 border border-slate-700">Grade</th>
              <th class="p-1 border border-slate-700">Remarks</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="bg-slate-100 font-black text-xs border-t-2 border-slate-900">
              <td colspan="2" class="p-1.5 text-right uppercase border-r border-slate-400">Grand Total:</td>
              <td class="p-1.5 text-center border-r border-slate-400">${grandT1}</td>
              <td class="p-1.5 text-center border-r border-slate-400">${grandO1}</td>
              <td class="p-1.5 text-center border-r border-slate-400">${grandT2}</td>
              <td class="p-1.5 text-center border-r border-slate-400">${grandO2}</td>
              <td class="p-1.5 text-center border-r border-slate-400">${overallTotal}</td>
              <td class="p-1.5 text-center text-blue-900 border-r border-slate-400">${overallObtained}</td>
              <td class="p-1.5 text-center border-r border-slate-400">${grandPct}%</td>
              <td class="p-1.5 text-center border-r border-slate-400">${finalEval.grade}</td>
              <td class="p-1.5 text-center text-emerald-800">${finalEval.remarks}</td>
              <td class="no-print"></td>
            </tr>
          </tbody>
        </table>

        <!-- Result Summary -->
        <div class="grid grid-cols-4 gap-2 bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-center text-xs mb-4">
          <div>Overall Marks: <b>${overallObtained} / ${overallTotal}</b></div>
          <div>Percentage: <b class="text-blue-900">${grandPct}%</b></div>
          <div>Final Award: <b class="text-emerald-700">${finalEval.grade}</b></div>

    // Logo Upload
    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedLogo = evt.target.result;
        renderCurrentView();
      };
      reader.readAsDataURL(file);
    }
